name: 🔄 Actualizar M3U de Ace Stream

on:
  schedule:
    # Cada hora (minuto 0)
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'generate_m3u.py'
      - '.github/workflows/update_m3u.yml'

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: pip install requests

      - name: 🔄 Generar archivo M3U
        run: python generate_m3u.py

      - name: 📊 Verificar cambios
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Cambios detectados"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Sin cambios"
          fi

      - name: 💾 Commit y push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add acestream_channels.m3u metadata.json
          git commit -m "🔄 Actualización - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: 📋 Resumen final
        run: |
          echo "📺 Archivo generado correctamente"
          echo "🔗 URL: https://raw.githubusercontent.com/${{ github.repository }}/main/acestream_channels.m3u"
