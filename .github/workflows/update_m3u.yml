name: 🔄 Actualizar M3U de Ace Stream

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'generate_m3u.py'
      - '.github/workflows/update_m3u.yml'

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Instalar requests
        run: pip install requests

      - name: 🔄 Generar M3U
        run: python generate_m3u.py

      - name: 📊 ¿Hay cambios?
        id: changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: 💾 Commit y push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add acestream_channels.m3u metadata.json
          git commit -m "🔄 Update canales - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
